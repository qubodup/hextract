<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Color Extractor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 20px;
}

textarea {
    width: 100%;
    height: 160px;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
    margin-bottom: 15px;
    resize: vertical;
}

button {
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 15px;
}

#results {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.color-box {
    width: 120px;
    height: 80px;
    border-radius: 6px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    position: relative;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.color-label {
    background: rgba(255,255,255,0.8);
    padding: 2px 6px;
    border-radius: 4px;
    user-select: all;
}
</style>
</head>

<body>

<h2>HTML HEX Color Extractor</h2>

<textarea id="inputText" placeholder="Paste any text containing #hex colors here..."></textarea>
<br>
<label>
  <input type="checkbox" id="sortToggle">
  Sort alphabetically
</label>
<button onclick="extractColors()">Extract Colors</button>

<div id="results"></div>

<script>
function extractColors() {
    const text = document.getElementById('inputText').value;
    const sortAlphabetically = document.getElementById('sortToggle').checked;

    const regex = /#([0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})(?=[^0-9a-fA-F]|$)/g;

    const matches = text.match(regex) || [];

    // Normalize to lowercase
    const normalized = matches.map(c => c.toLowerCase());

    let finalColors;

    if (sortAlphabetically) {
        // Remove duplicates then sort
        finalColors = [...new Set(normalized)].sort();
    } else {
        // Keep first-found order
        const seen = new Set();
        finalColors = [];

        for (let color of normalized) {
            if (!seen.has(color)) {
                seen.add(color);
                finalColors.push(color);
            }
        }
    }

    displayColors(finalColors);
}

function displayColors(colors) {
    const container = document.getElementById('results');
    container.innerHTML = '';

    colors.forEach(color => {
        const box = document.createElement('div');
        box.className = 'color-box';
        box.style.backgroundColor = color;

        const label = document.createElement('div');
        label.className = 'color-label';
        label.textContent = color;

        // Click to copy
        box.addEventListener('click', () => {
            navigator.clipboard.writeText(color);
            label.textContent = "Copied!";
            setTimeout(() => label.textContent = color, 1000);
        });

        box.appendChild(label);
        container.appendChild(box);
    });
}
</script>

</body>
</html>
